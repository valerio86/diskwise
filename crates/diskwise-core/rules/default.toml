# diskwise built-in rules.
#
# Each rule claims tree nodes whose absolute path matches one of its `match` globs
# (and none of its `exclude` globs) and that pass its conditions. Rules are tried
# in file order and the FIRST match wins, so specific rules must come before
# generic ones. A claimed node's children are not examined further.
#
# Globs: `*` stays within one path segment, `**` spans segments, `{a,b}` alternates.
# `~/` means every home folder (/Users/*/).
#
# Fields:
#   kind             "dir" | "file" | "any" (default any)
#   min_size         smallest node to report, e.g. "50M" (default 50M)
#   older_than_days  only if nothing inside changed for this long
#   sibling          only if this file exists next to the match (e.g. Cargo.toml)
#   category         cache | logs | regenerable | app_managed | installer | developer | user_data | system
#   safety           safe     – deleting loses nothing; it regrows or is never needed again
#                    caution  – safe once you've done something first (quit the app, check a project)
#                    review   – your data or a judgment call; look before acting
#   action           trash    – move to Trash
#                    in_app   – clear it from inside the owning app
#                    admin    – needs your admin password (owned by root)
#                    archive  – move to external or cloud storage
#                    info     – nothing to delete; explains where space went
#   why / how / prevent   shown to the user

# ── App-specific (most specific first) ──────────────────────────────────────

[[rule]]
id = "claude-vm-bundle"
title = "Claude desktop VM image"
match = ["~/Library/Application Support/Claude/vm_bundles/*"]
category = "regenerable"
safety = "safe"
action = "trash"
why = "The Linux virtual machine Claude's desktop app uses for sandboxed tasks. It is downloaded on demand."
how = "Quit Claude, then move it to the Trash. The app downloads it again the next time a feature needs it."

[[rule]]
id = "chrome-on-device-model"
title = "Chrome on-device AI model"
match = ["~/Library/Application Support/Google/Chrome/OptGuideOnDeviceModel"]
category = "app_managed"
safety = "caution"
action = "in_app"
why = "Gemini Nano, downloaded by Chrome for built-in AI features. Deleting it alone doesn't help: Chrome downloads it again."
how = "Turn the model off with the policy below, then restart Chrome. Chrome removes the folder itself."
prevent = "defaults write com.google.Chrome GenAILocalFoundationalModelSettings -integer 1   (undo: defaults delete com.google.Chrome GenAILocalFoundationalModelSettings)"

[[rule]]
id = "google-updater-cache"
title = "Google updater download cache"
match = ["~/Library/Application Support/Google/GoogleUpdater/crx_cache"]
category = "cache"
safety = "safe"
action = "trash"
why = "Installer packages Google's updater keeps after updating Chrome and other Google apps."
how = "Move the folder's contents to the Trash."

[[rule]]
id = "lightroom-smart-previews"
title = "Lightroom Smart Previews"
match = ["~/**/*Smart Previews.lrdata"]
category = "app_managed"
safety = "review"
action = "in_app"
why = "Compressed copies that let you edit photos while the originals are offline. If your originals are always on this Mac, you probably don't need them."
how = "In Lightroom Classic, select the photos, then Library → Previews → Discard Smart Previews."

[[rule]]
id = "lightroom-previews"
title = "Lightroom preview cache"
match = ["~/**/*Previews.lrdata"]
category = "regenerable"
safety = "caution"
action = "trash"
why = "Thumbnails and previews Lightroom Classic shows in Grid and Loupe. Your edits are stored in the .lrcat catalog, not here. \"Discard 1:1 Previews\" only removes full-size previews, which is often very little."
how = "Quit Lightroom Classic, then move this folder to the Trash. Lightroom rebuilds previews as you browse, so the first browse is slower."
prevent = "Catalog Settings → File Handling: set Standard Preview Size to Auto, Preview Quality to Medium, and Discard 1:1 Previews to After 30 Days."

[[rule]]
id = "lightroom-old-catalogs"
title = "Old Lightroom catalogs and backups"
match = ["~/**/Old Lightroom Catalogs", "~/**/Lightroom/Backups"]
category = "app_managed"
safety = "review"
action = "trash"
why = "Catalogs left over from Lightroom upgrades, and automatic catalog backups. Only the current catalog and the newest backup are needed."
how = "Keep the newest backup; move older backups and pre-upgrade catalogs to the Trash."

[[rule]]
id = "adobe-installer-leftovers"
title = "Leftover Adobe installer packages"
match = ["/.adobeTemp"]
min_size = "10M"
category = "installer"
safety = "caution"
action = "admin"
why = "A hidden folder where Creative Cloud stages app installers (.pimx). Old ones are often never cleaned up."
how = "Make sure Creative Cloud isn't installing or updating anything, then run: sudo rm -rf /System/Volumes/Data/.adobeTemp/*"

[[rule]]
id = "adobe-media-cache"
title = "Adobe media cache"
match = ["~/Library/Application Support/Adobe/Common/Media Cache Files", "~/Library/Application Support/Adobe/Common/Media Cache"]
category = "cache"
safety = "safe"
action = "in_app"
why = "Audio and video conform files from Premiere, After Effects and similar apps. They are rebuilt when needed."
how = "In the Adobe app: Settings → Media Cache → Delete. Or quit the apps and move the folder's contents to the Trash."

[[rule]]
id = "whatsapp-media"
title = "WhatsApp media"
match = ["~/Library/Group Containers/group.net.whatsapp.WhatsApp.shared"]
min_size = "500M"
category = "user_data"
safety = "review"
action = "in_app"
why = "Photos, videos and documents from your chats, stored inside WhatsApp's own folder."
how = "Delete media from large chats inside WhatsApp. Don't delete files here by hand: WhatsApp's database would get out of sync."

[[rule]]
id = "ios-backups"
title = "iPhone / iPad backups"
match = ["~/Library/Application Support/MobileSync/Backup/*"]
category = "user_data"
safety = "review"
action = "in_app"
why = "Local device backups made by Finder. Old ones for devices you no longer have are pure waste."
how = "Finder → select the device → Manage Backups, then delete the old ones."

[[rule]]
id = "ios-software-updates"
title = "Downloaded iOS software updates"
match = ["~/Library/iTunes/*Software Updates"]
category = "installer"
safety = "safe"
action = "trash"
why = "iOS and iPadOS installers Finder downloaded to update a connected device."
how = "Move to the Trash."

[[rule]]
id = "messages-shared-photos"
title = "Photos shared with you in Messages"
match = ["~/Library/Photos/Libraries/Syndication.photoslibrary"]
min_size = "500M"
category = "app_managed"
safety = "review"
action = "in_app"
why = "macOS's \"Shared with You\" library: photos and videos people sent you in Messages, kept so Photos can show them. It isn't your main Photos library."
how = "Delete large attachments in Messages (select a chat → Info → Photos), or turn off Photos under Messages → Settings → Shared with You."

[[rule]]
id = "photos-library"
title = "Apple Photos library"
match = ["~/**/*.photoslibrary"]
min_size = "1G"
category = "user_data"
safety = "review"
action = "in_app"
why = "Your Apple Photos library. Don't edit its contents by hand."
how = "If you use iCloud Photos: Photos → Settings → iCloud → Optimize Mac Storage. Otherwise, move the whole library to an external drive and open it from there."

[[rule]]
id = "docker-disk"
title = "Docker disk image"
match = ["~/Library/Containers/com.docker.docker/Data/vms"]
category = "developer"
safety = "caution"
action = "in_app"
why = "The virtual disk holding all Docker images, containers and volumes. It grows and rarely shrinks on its own."
how = "Run `docker system prune -a` (add --volumes to drop unused volumes), or lower the disk limit in Docker Desktop → Settings → Resources."

[[rule]]
id = "macos-installer-app"
title = "macOS installer app"
match = ["/Applications/Install macOS*.app"]
category = "installer"
safety = "safe"
action = "trash"
why = "A full macOS installer. You can download it again from the App Store whenever you need it."
how = "Move to the Trash."

[[rule]]
id = "wallpaper-aerials"
title = "Wallpaper and screen saver videos"
match = ["~/Library/Application Support/com.apple.wallpaper", "/Library/Application Support/com.apple.idleassetsd/Customer"]
min_size = "200M"
category = "system"
safety = "review"
action = "info"
why = "Aerial wallpaper and screen saver videos downloaded by macOS, plus wallpaper data. macOS manages these files."
how = "Don't delete them by hand. Choosing a static wallpaper and screen saver in System Settings stops new downloads."

# ── Developer tooling ───────────────────────────────────────────────────────

[[rule]]
id = "xcode-derived-data"
title = "Xcode DerivedData"
match = ["~/Library/Developer/Xcode/DerivedData"]
category = "developer"
safety = "safe"
action = "trash"
why = "Build products and indexes. Xcode rebuilds them."
how = "Quit Xcode, then move the folder's contents to the Trash."

[[rule]]
id = "xcode-device-support"
title = "Xcode device support files"
match = ["~/Library/Developer/Xcode/*DeviceSupport"]
category = "developer"
safety = "safe"
action = "trash"
why = "Debug symbols copied from every OS version of every device you've connected. Old versions are never used again."
how = "Move folders for old OS versions to the Trash. Xcode copies them again if a device needs them."

[[rule]]
id = "simulators"
title = "iOS simulators and runtimes"
match = ["~/Library/Developer/CoreSimulator", "/Library/Developer/CoreSimulator"]
category = "developer"
safety = "caution"
action = "in_app"
why = "Simulator devices and OS runtimes for Xcode."
how = "Run `xcrun simctl delete unavailable`. To remove a runtime: `xcrun simctl runtime list`, then `xcrun simctl runtime delete <id>`."

[[rule]]
id = "rust-target"
title = "Rust build output"
match = ["~/**/target"]
kind = "dir"
sibling = "Cargo.toml"
older_than_days = 30
category = "developer"
safety = "safe"
action = "trash"
why = "Compiled artifacts for a Rust project you haven't built in a month. `cargo build` regenerates them."
how = "Run `cargo clean` in the project, or move target/ to the Trash."

[[rule]]
id = "node-modules"
title = "Node.js dependencies"
match = ["~/**/node_modules"]
kind = "dir"
category = "developer"
safety = "caution"
action = "trash"
why = "Installed npm packages. `npm install` restores them from package.json."
how = "For projects you aren't working on, move node_modules/ to the Trash."

[[rule]]
id = "python-venv"
title = "Python virtual environments"
match = ["~/**/.venv", "~/**/venv"]
kind = "dir"
category = "developer"
safety = "caution"
action = "trash"
why = "Installed Python packages for one project. They can be recreated from requirements.txt or pyproject.toml."
how = "For dormant projects, delete the folder, then recreate it later with `python -m venv .venv && pip install -r requirements.txt` (or `uv sync`)."

[[rule]]
id = "package-manager-caches"
title = "Package manager caches"
match = ["~/.npm/_cacache", "~/.gradle/caches", "~/.cargo/registry", "~/.cache/pip", "~/.cache/uv", "~/.pnpm-store", "~/Library/pnpm/store"]
category = "cache"
safety = "safe"
action = "trash"
why = "Downloaded packages kept so reinstalls are faster. They're downloaded again when needed."
how = "Use the tool's own cleaner (`npm cache clean --force`, `uv cache clean`, `cargo cache -a` if installed), or move the folder to the Trash."

[[rule]]
id = "maven-repo"
title = "Maven local repository"
match = ["~/.m2/repository"]
min_size = "200M"
category = "cache"
safety = "safe"
action = "trash"
why = "Downloaded Java dependencies. Maven and Gradle download them again on the next build."
how = "Move to the Trash. Your next build will be slower while dependencies download."

[[rule]]
id = "ml-models"
title = "Downloaded AI models"
match = ["~/.cache/huggingface", "~/.ollama/models", "~/.cache/lm-studio", "~/.lmstudio/models"]
category = "developer"
safety = "review"
action = "in_app"
why = "Local machine-learning model weights. They can be downloaded again, but often run to several GB each."
how = "Remove models you no longer use with the tool's own command (`ollama rm <model>`, `huggingface-cli delete-cache`)."

# ── Generic caches and logs ────────────────────────────────────────────────

[[rule]]
id = "electron-app-caches"
title = "App web caches"
match = [
  "~/Library/Application Support/*/Cache",
  "~/Library/Application Support/*/Code Cache",
  "~/Library/Application Support/*/GPUCache",
  "~/Library/Application Support/*/Service Worker/CacheStorage",
]
category = "cache"
safety = "caution"
action = "trash"
why = "Browser-engine caches inside desktop apps (Electron/Chromium: Slack, Claude, VS Code, …)."
how = "Quit the app first, then move the folder to the Trash. The app rebuilds it."

[[rule]]
id = "user-caches"
title = "App caches"
match = ["~/Library/Caches/*"]
category = "cache"
safety = "safe"
action = "trash"
why = "Data apps keep to speed things up. Apps rebuild it as needed."
how = "Quit the app, then move the folder's contents to the Trash. Some space will come back as the app is used."

[[rule]]
id = "user-logs"
title = "App logs"
match = ["~/Library/Logs/*"]
category = "logs"
safety = "safe"
action = "trash"
why = "Diagnostic logs. Nothing uses them except for troubleshooting."
how = "Move them to the Trash."

[[rule]]
id = "system-caches"
title = "System-wide caches"
match = ["/Library/Caches/*"]
category = "cache"
safety = "caution"
action = "admin"
why = "Caches shared by all users. Most are rebuilt automatically."
how = "Use Finder with an admin password, or `sudo rm -rf` on specific subfolders. Leave Apple folders alone if unsure."

[[rule]]
id = "system-logs"
title = "System-wide logs"
match = ["/Library/Logs/*", "/private/var/log"]
category = "logs"
safety = "caution"
action = "admin"
why = "Logs written by system services and installers."
how = "Old, large log files can be removed with an admin password. macOS rotates its own logs."

[[rule]]
id = "trash"
title = "Trash"
match = ["~/.Trash"]
min_size = "10M"
category = "user_data"
safety = "safe"
action = "in_app"
why = "Files you already deleted. They still take up space until the Trash is emptied."
how = "Finder → Empty Trash."

[[rule]]
id = "macos-update-staging"
title = "Staged macOS updates"
match = ["/Library/Updates", "/macOS Install Data"]
category = "system"
safety = "review"
action = "info"
why = "macOS update files that have been downloaded but not yet installed."
how = "Install the pending update (System Settings → General → Software Update) and macOS deletes these."

[[rule]]
id = "system-temp"
title = "System temporary files"
match = ["/private/var/folders"]
min_size = "1G"
category = "system"
safety = "review"
action = "info"
why = "Per-user temporary files and caches managed by macOS."
how = "Don't delete these by hand. A restart clears most of them."

[[rule]]
id = "command-line-tools"
title = "Xcode Command Line Tools"
match = ["/Library/Developer/CommandLineTools"]
category = "developer"
safety = "review"
action = "info"
why = "Compilers and git used by Homebrew and most development tools."
how = "Keep these if you use git, Homebrew, or build software."

# ── Your files (generic; keep these last) ──────────────────────────────────

[[rule]]
id = "downloaded-installers"
title = "Installers in Downloads"
match = ["~/Downloads/**/*.{dmg,pkg,mpkg,iso,xip}"]
kind = "file"
min_size = "20M"
older_than_days = 14
category = "installer"
safety = "safe"
action = "trash"
why = "App installers and disk images. Once the app is installed you can download the installer again if you ever need it."
how = "Move to the Trash."

[[rule]]
id = "downloaded-archives"
title = "Archives in Downloads"
match = ["~/Downloads/**/*.{zip,tar,gz,tgz,bz2,xz,7z,rar}"]
kind = "file"
min_size = "20M"
older_than_days = 30
category = "user_data"
safety = "review"
action = "trash"
why = "Compressed files. These can hold anything, from a throwaway download to the only copy of something, so check what's inside."
how = "If you've already extracted it and kept the contents, the archive can go to the Trash. Otherwise extract it or move it somewhere permanent."

[[rule]]
id = "old-downloads"
title = "Old downloads"
match = ["~/Downloads/*"]
min_size = "20M"
older_than_days = 365
category = "user_data"
safety = "review"
action = "trash"
why = "Items in Downloads that haven't changed in over a year."
how = "Look through them: keep what matters (move it out of Downloads) and trash the rest."

[[rule]]
id = "large-old-files"
title = "Large files untouched for a year"
match = ["~/**"]
exclude = ["~/Library/**", "~/.*/**", "~/.*"]
kind = "file"
min_size = "1G"
older_than_days = 365
category = "user_data"
safety = "review"
action = "archive"
why = "Big files you haven't modified in over a year: videos, disk images, exports."
how = "Archive them to an external drive or cloud storage if you want to keep them."

[[rule]]
id = "dormant-folders"
title = "Large folders untouched for two years"
match = ["~/*/*"]
exclude = ["~/Library/**", "~/.*/**", "~/.*"]
kind = "dir"
min_size = "1G"
older_than_days = 730
category = "user_data"
safety = "review"
action = "archive"
why = "Big folders where nothing has changed in two years, such as old photo years or finished projects."
how = "Archive them to an external drive or cloud storage, check the copy opens, then remove them here."
