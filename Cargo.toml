[workspace]
resolver = "3"
members = ["crates/*"]
# Plain `cargo build/test/clippy` skip the desktop app, which needs a webview
# toolkit (WebKitGTK on Linux). Build it with `cargo build -p diskwise-app`.
default-members = ["crates/diskwise-core", "crates/diskwise-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
diskwise-core = { path = "crates/diskwise-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
libc = "0.2"
plist = "1"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
trash = "5"
xattr = "1"

[profile.release]
lto = "thin"
codegen-units = 1
